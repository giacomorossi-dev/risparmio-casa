services:
  postgres:
    image: postgres:17-alpine
    container_name: rc_postgres
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc
      POSTGRES_DB: risparmiocasa
    volumes:
      - ./.docker/pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d risparmiocasa"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rc_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
