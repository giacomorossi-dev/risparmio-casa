name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref }}-
            turbo-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Genera .sst/platform/config.d.ts (global $app/sst/aws referenziati da
      # sst.config.ts + infra/**). È gitignorato e prodotto dalla CLI SST: senza,
      # `tsc -p tsconfig.infra.json` fallisce con "Cannot find name '$app'".
      # `sst install` non richiede credenziali AWS (scarica solo i provider).
      - name: Generate SST types
        run: bunx sst install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: e2e (quale-conviene)
    runs-on: ubuntu-latest
    # Le route /quale-conviene sono pubbliche e l'app rende anche senza Clerk
    # (build key-less → clerkEnabled=false). Nessun secret necessario.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run test:e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
